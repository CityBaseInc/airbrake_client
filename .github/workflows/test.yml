name: Unit Tests

on:
  push:
    branches:
      - '*'

jobs:
  version_tests:
    runs-on: ubuntu-latest
    name: OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    strategy:
      matrix:
        include:
          - elixir: '1.17'
            otp: '27'
          - elixir: '1.18'
            otp: '27'
          - elixir: '1.19'
            otp: '27'
          - elixir: '1.19'
            otp: '28'
          - elixir: '1.20'
            otp: '28'
          - elixir: '1.20'
            otp: '29'
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}
      - run: mix deps.get
      - run: mix test

  all_versions_tests:
    name: "All Versions Tests"
    needs: version_tests
    runs-on: ubuntu-latest
    steps:
      - run: echo "Elixir tests for many versions of Elixir and OTP have successfully completed."

  poison_only_test:
    runs-on: ubuntu-latest
    name: Test - poison only, no jason
    defaults:
      run:
        working-directory: integration_test_apps/poison_only_app
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20'
      - run: mix deps.get
      - run: mix test

  jason_only_test:
    runs-on: ubuntu-latest
    name: Test - jason only, no poison
    defaults:
      run:
        working-directory: integration_test_apps/jason_only_app
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20'
      - run: mix deps.get
      - run: mix test

  json_only_test:
    runs-on: ubuntu-latest
    name: Test - json only, no jason or poison
    defaults:
      run:
        working-directory: integration_test_apps/json_only_app
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20'
      - run: mix deps.get
      - run: mix test

  default_processor_test:
    runs-on: ubuntu-latest
    name: Test - default payload processor
    defaults:
      run:
        working-directory: integration_test_apps/default_processor_app
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29'
          elixir-version: '1.20'
      - run: mix deps.get
      - run: mix test

  all_tests:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      matrix:
        include:
          - elixir: '1.20'
            otp: '29'
          - elixir: '1.20'
            otp: '29'
            httpoison: '~> 2.0'
    steps:
      - uses: actions/checkout@v7
      - name: Setup elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      - name: Restrict HTTPoison Version
        if: matrix.httpoison
        run: |
          sed -i 's/{:httpoison, "[^"]*"}/{:httpoison, "${{matrix.httpoison}}"}/' mix.exs
          grep -F '{:httpoison, "${{matrix.httpoison}}"}' mix.exs

      - name: Get Deps
        run: mix deps.get

      - name: Verify HTTPoison Version
        if: matrix.httpoison
        run: |
          grep -E '"httpoison": \{:hex, :httpoison, "2\.' mix.lock

      - name: Cache Elixir build
        uses: actions/cache@v6
        with:
          path: _build
          key: elixir-build-v2-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('lib/**/*.ex', 'config/*.exs', 'mix.exs') }}

      - name: Compile Deps
        run: mix deps.compile

      - name: Compiler Warnings
        run: mix compile --force --warnings-as-errors

      - name: Run Credo
        run: mix credo --strict

      - name: Check Format
        run: mix format --check-formatted

      - name: Run Coveralls
        run: mix coveralls

      - name: Generate Docs
        run: mix docs --output test/doc

      - name: Run Dialyzer
        run: mix dialyzer --list-unused-filters

  required_all_tests:
    name: "Complete Elixir Tests"
    needs: [all_tests]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Elixir tests and static analyses completed successfully."
